name: Publish @thegirlbeforehim via Buffer

on:
  schedule:
    # Off-peak UTC minutes (:07 and :37) = ~23 min before every :30/:00 EST slot,
    # avoiding GitHub Actions :00/:10/:30/:40 cron congestion and catching any missed slot.
    - cron: '7,37 * * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish_buffer.yml'
      - 'scripts/publish_from_gdrive.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-buffer
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch from Google Drive, host on GitHub Pages, and push to Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
        run: python scripts/publish_from_gdrive.py

      - name: Commit updated published.json ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published.json
          if ! git diff --staged --quiet; then
            git commit -m "Record published post in published.json [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
