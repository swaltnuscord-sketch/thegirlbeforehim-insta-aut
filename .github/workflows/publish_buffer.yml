name: Publish @thegirlbeforehim via Buffer

on:
  schedule:
    # 20 minutes before each EST posting slot (UTC)
    - cron: '10 12 * * *' # 7:10 AM EST (Slot 1 - 7:30 AM EST)
    - cron: '40 16 * * *' # 11:40 AM EST (Slot 2 - 12:00 PM EST)
    - cron: '10 20 * * *' # 3:10 PM EST (Slot 3 - 3:30 PM EST)
    - cron: '10 23 * * *' # 6:10 PM EST (Slot 4 - 6:30 PM EST)
    - cron: '40 1 * * *'  # 8:40 PM EST (Slot 5 - 9:00 PM EST)
    - cron: '10 3 * * *'  # 10:10 PM EST (Slot 6 - 10:30 PM EST)
    - cron: '10 5 * * *'  # 12:10 AM EST (Slot 7 - 12:30 AM EST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch from Google Drive, host on GitHub Pages, and push to Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
        run: python scripts/publish_from_gdrive.py

      - name: Commit updated published.json ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published.json
          if ! git diff --staged --quiet; then
            git commit -m "Record published post in published.json"
            git pull --rebase origin main
            git push origin main
          fi
